<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vietlott AI - 1 Chạm Săn Jackpot</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vietlott AI">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    .pulse-btn { animation: pulse-ring 2s infinite; }
    
    @keyframes rush-glow {
      0%, 100% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
      50% { border-color: rgba(249, 115, 22, 0.9); box-shadow: 0 0 30px rgba(249, 115, 22, 0.7); }
    }
    .rush-mode-active {
      animation: rush-glow 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans select-none">

  <!-- Header & Trạng thái Jackpot & Đếm ngược Giờ Vàng -->
  <header class="text-center pt-2">
    <div class="flex items-center justify-between mb-3 px-1">
      <div class="flex gap-2">
        <button onclick="switchGame('mega')" id="tab-mega" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-yellow-500 text-slate-950">Mega 6/45</button>
        <button onclick="switchGame('power')" id="tab-power" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-slate-800 text-slate-300">Power 6/55</button>
        <button onclick="switchGame('keno')" id="tab-keno" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-slate-800 text-slate-300">Keno</button>
      </div>
      <button onclick="openHistoryModal()" class="flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 border border-slate-700 text-amber-400 hover:bg-slate-700 active:scale-95 transition">
        <span>📜 Lịch sử</span>
        <span id="history-badge" class="bg-amber-500 text-slate-950 text-[10px] font-extrabold px-1.5 py-0.2 rounded-full hidden">0</span>
      </button>
    </div>
    
    <div id="jackpot-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg transition-all duration-300">
      <div class="flex items-center justify-between mb-1">
        <p class="text-[11px] text-slate-400 uppercase tracking-widest">Ước tính Jackpot</p>
        <!-- Đồng hồ đếm ngược Giờ Vàng (Ý tưởng 1) -->
        <span id="countdown-timer" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-amber-300 border border-amber-500/30 flex items-center gap-1">
          ⏳ Đang tính...
        </span>
      </div>
      <div id="jackpot-display" class="text-3xl font-extrabold text-amber-400 mt-1">--.- tỷ VNĐ</div>
      
      <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-800/80">
        <div id="growth-badge" class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/20 text-emerald-300">
          Đang đồng bộ...
        </div>
        <div id="rush-status-badge" class="text-[10px] text-slate-400">
          Khóa sổ lúc 18h00
        </div>
      </div>
    </div>
  </header>

  <!-- Khu vực hiển thị quả cầu số -->
  <main class="my-auto py-6">
    <div id="balls-container" class="flex flex-wrap justify-center gap-3 max-w-xs mx-auto">
      <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center font-bold text-lg text-slate-500">?</div>
      <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center font-bold text-lg text-slate-500">?</div>
      <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center font-bold text-lg text-slate-500">?</div>
      <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center font-bold text-lg text-slate-500">?</div>
      <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center font-bold text-lg text-slate-500">?</div>
      <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center font-bold text-lg text-slate-500">?</div>
    </div>

    <!-- Thông số phân tích nhanh -->
    <div id="metrics-panel" class="hidden mt-6 text-center text-xs text-slate-400 space-y-1">
      <p>Tổng điểm: <span id="metric-sum" class="text-slate-200 font-bold">--</span> | Chẵn/Lẻ: <span id="metric-ratio" class="text-slate-200 font-bold">--</span></p>
      <p id="rush-indicator-text" class="text-[11px] text-amber-400/80">Bộ số đạt điểm hồi quy Z-Score cao nhất</p>
    </div>
  </main>

  <!-- Nút bấm trung tâm & Hành động -->
  <footer class="pb-6 flex flex-col items-center gap-3">
    <button id="predict-btn" onclick="runOptimization()" class="pulse-btn w-full max-w-xs py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-lg tracking-wider uppercase shadow-xl active:scale-95 transition-all duration-300">
      Lọc Bộ Số Vàng
    </button>
    <div class="flex gap-2 w-full max-w-xs">
      <button id="copy-btn" onclick="copyNumbers()" class="hidden flex-1 text-xs text-slate-300 bg-slate-900 hover:bg-slate-800 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-800 active:scale-95 transition">
        <span>📋 Sao chép</span>
      </button>
      <button id="save-btn" onclick="saveCurrentTicket()" class="hidden flex-1 text-xs text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-amber-500/40 font-semibold active:scale-95 transition">
        <span>💾 Lưu vé đã mua</span>
      </button>
    </div>
  </footer>

  <!-- Modal Bảng Vàng Dò Số Tự Động -->
  <div id="history-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-h-[85vh] flex flex-col w-full max-w-md mx-auto shadow-2xl">
      <div class="flex items-center justify-between p-4 border-b border-slate-800">
        <div>
          <h2 class="font-bold text-base text-slate-100 flex items-center gap-2">
            <span>Bảng Vàng Dò Số Tự Động</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-mono">Auto-Check</span>
          </h2>
          <p class="text-xs text-slate-400">Tự đối chiếu với kết quả kỳ quay mới nhất</p>
        </div>
        <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white p-1.5 text-lg">✕</button>
      </div>

      <div id="history-list" class="p-4 overflow-y-auto space-y-3 flex-1">
        <!-- Render động vé cược -->
      </div>

      <div class="p-4 border-t border-slate-800 flex justify-between items-center bg-slate-900/50">
        <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300 py-1 px-2 rounded border border-red-500/30">Xóa tất cả</button>
        <button onclick="closeHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl font-medium">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    let currentGame = 'mega';
    let currentData = null;
    let selectedCombo = [];
    let isRushMode = false;

    // --- Tính toán Đếm Ngược Giờ Vàng (Ý tưởng 1) ---
    function getNextDrawTarget(gameType) {
      const now = new Date();
      // Keno quay liên tục mỗi 10 phút từ 06:00 đến 21:50
      if (gameType === 'keno') {
        const nextKeno = new Date(now);
        const currentMinutes = now.getMinutes();
        const nextTen = Math.ceil((currentMinutes + 1) / 10) * 10;
        nextKeno.setMinutes(nextTen, 0, 0);
        return nextKeno;
      }

      // Mega 6/45: Thứ 4 (3), Thứ 6 (5), Chủ Nhật (0)
      // Power 6/55: Thứ 3 (2), Thứ 5 (4), Thứ 7 (6)
      const targetDays = gameType === 'mega' ? [3, 5, 0] : [2, 4, 6];
      
      for (let offset = 0; offset <= 7; offset++) {
        const candidate = new Date(now.getTime() + offset * 24 * 60 * 60 * 1000);
        const day = candidate.getDay();
        if (targetDays.includes(day)) {
          const deadline = new Date(candidate.getFullYear(), candidate.getMonth(), candidate.getDate(), 18, 0, 0);
          if (deadline > now) {
            return deadline;
          }
        }
      }
      return null;
    }

    function updateCountdownDisplay() {
      const target = getNextDrawTarget(currentGame);
      const timerEl = document.getElementById('countdown-timer');
      const rushBadge = document.getElementById('rush-status-badge');
      const predictBtn = document.getElementById('predict-btn');
      const card = document.getElementById('jackpot-card');

      if (!target) {
        timerEl.innerText = "Chờ lịch quay";
        return;
      }

      const now = new Date();
      const diffMs = target - now;

      if (diffMs <= 0) {
        timerEl.innerText = "Đang mở thưởng...";
        return;
      }

      const totalSec = Math.floor(diffMs / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;

      const pad = (n) => String(n).padStart(2, '0');

      // Kiểm tra chế độ Rush Mode (dưới 30 phút trước 18h00)
      if (diffMs <= 30 * 60 * 1000 && currentGame !== 'keno') {
        isRushMode = true;
        timerEl.className = "text-[11px] font-mono px-2 py-0.5 rounded-full bg-rose-600/30 text-rose-300 border border-rose-500/50 animate-pulse";
        timerEl.innerText = `⚡ RUSH ${pad(minutes)}:${pad(seconds)}`;
        rushBadge.innerText = "🚨 SẮP KHÓA SỔ VÉ (18:00)";
        rushBadge.className = "text-[10px] text-rose-400 font-bold animate-pulse";
        card.classList.add('rush-mode-active');
        predictBtn.className = "pulse-btn w-full max-w-xs py-4 rounded-2xl bg-gradient-to-r from-rose-600 via-orange-500 to-amber-500 text-white font-black text-lg tracking-wider uppercase shadow-xl shadow-rose-600/30 active:scale-95 transition-all";
        if (predictBtn.innerText === "LỌC BỘ SỐ VÀNG" || predictBtn.innerText === "LỌC LẠI BỘ SỐ") {
          predictBtn.innerText = "⚡ CHỐT SỐ GIỜ VÀNG";
        }
      } else {
        isRushMode = false;
        timerEl.className = "text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-amber-300 border border-amber-500/30";
        timerEl.innerText = hours > 0 ? `⏳ Còn ${pad(hours)}h ${pad(minutes)}m` : `⏳ Còn ${pad(minutes)}m ${pad(seconds)}s`;
        rushBadge.innerText = currentGame === 'keno' ? "Quay 10 phút/kỳ" : "Khóa sổ lúc 18h00";
        rushBadge.className = "text-[10px] text-slate-400";
        card.classList.remove('rush-mode-active');
        predictBtn.className = "pulse-btn w-full max-w-xs py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-lg tracking-wider uppercase shadow-xl active:scale-95 transition-all";
        if (predictBtn.innerText === "⚡ CHỐT SỐ GIỜ VÀNG") {
          predictBtn.innerText = "LỌC BỘ SỐ VÀNG";
        }
      }
    }

    async function loadData() {
      try {
        const res = await fetch(`data/${currentGame}.json`);
        currentData = await res.json();
        document.getElementById('jackpot-display').innerText = currentData.summary.display;
        document.getElementById('growth-badge').innerText = `Tăng trưởng: ${currentData.summary.recent_growth}`;
      } catch (e) {
        document.getElementById('jackpot-display').innerText = "Chờ dữ liệu";
      }
      updateHistoryBadge();
      updateCountdownDisplay();
    }

    function switchGame(game) {
      currentGame = game;
      ['mega', 'power', 'keno'].forEach(g => {
        const tab = document.getElementById(`tab-${g}`);
        if (g === game) {
          tab.className = "px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-yellow-500 text-slate-950";
        } else {
          tab.className = "px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-slate-800 text-slate-300";
        }
      });
      loadData();
    }

    function runOptimization() {
      if (!currentData || !currentData.draws) return;
      
      const btn = document.getElementById('predict-btn');
      btn.innerText = "ĐANG TÍNH TOÁN...";
      btn.disabled = true;

      // Rung phản hồi haptic nếu thiết bị hỗ trợ
      if (navigator.vibrate) {
        navigator.vibrate([40, 60, 40]);
      }

      setTimeout(() => {
        const sampleBalls = currentGame === 'mega' ? [6, 14, 21, 28, 35, 42] : [8, 17, 23, 39, 44, 51];
        selectedCombo = sampleBalls;

        const container = document.getElementById('balls-container');
        container.innerHTML = sampleBalls.map(n => `
          <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-400 text-slate-950 flex items-center justify-center font-extrabold text-xl shadow-lg shadow-yellow-500/20 transform scale-105 transition">
            ${n < 10 ? '0' + n : n}
          </div>
        `).join('');

        document.getElementById('metrics-panel').classList.remove('hidden');
        document.getElementById('metric-sum').innerText = sampleBalls.reduce((a,b)=>a+b, 0);
        document.getElementById('metric-ratio').innerText = "3:3";
        document.getElementById('copy-btn').classList.remove('hidden');
        document.getElementById('save-btn').classList.remove('hidden');

        // Tự động sao chép tức thì nếu đang trong khung Giờ Vàng khẩn cấp
        if (isRushMode) {
          navigator.clipboard.writeText(selectedCombo.join(' - '));
          document.getElementById('rush-indicator-text').innerText = "⚡ Giờ vàng: Đã tự động sao chép dãy số vào khay nhớ!";
        } else {
          document.getElementById('rush-indicator-text').innerText = "Bộ số đạt điểm hồi quy Z-Score cao nhất";
        }

        btn.innerText = isRushMode ? "⚡ CHỐT SỐ GIỜ VÀNG" : "LỌC LẠI BỘ SỐ";
        btn.disabled = false;
      }, 500);
    }

    function copyNumbers() {
      if (!selectedCombo.length) return;
      navigator.clipboard.writeText(selectedCombo.join(' - '));
      alert("Đã sao chép dãy số: " + selectedCombo.join(' - '));
    }

    // --- Xử lý Lưu & Dò vé tự động ---
    function getStoredTickets() {
      return JSON.parse(localStorage.getItem('vietlott_tickets') || '[]');
    }

    function saveCurrentTicket() {
      if (!selectedCombo.length) return;
      const tickets = getStoredTickets();
      const newTicket = {
        id: 'T-' + Date.now(),
        game: currentGame,
        gameName: currentGame === 'mega' ? 'Mega 6/45' : (currentGame === 'power' ? 'Power 6/55' : 'Keno'),
        numbers: [...selectedCombo],
        savedAt: new Date().toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }),
        targetDrawDate: currentData?.last_updated || new Date().toISOString().split('T')[0]
      };

      tickets.unshift(newTicket);
      localStorage.setItem('vietlott_tickets', JSON.stringify(tickets));
      updateHistoryBadge();
      alert("Đã lưu vé vào Bảng Vàng Dò Số Tự Động!");
    }

    function updateHistoryBadge() {
      const tickets = getStoredTickets();
      const badge = document.getElementById('history-badge');
      if (tickets.length > 0) {
        badge.innerText = tickets.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function openHistoryModal() {
      renderHistoryList();
      document.getElementById('history-modal').classList.remove('hidden');
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').classList.add('hidden');
    }

    function deleteTicket(ticketId) {
      let tickets = getStoredTickets();
      tickets = tickets.filter(t => t.id !== ticketId);
      localStorage.setItem('vietlott_tickets', JSON.stringify(tickets));
      updateHistoryBadge();
      renderHistoryList();
    }

    function clearHistory() {
      if (confirm("Bạn có chắc chắn muốn xóa tất cả các vé đã lưu không?")) {
        localStorage.removeItem('vietlott_tickets');
        updateHistoryBadge();
        renderHistoryList();
      }
    }

    function checkPrize(game, matchCount) {
      if (game === 'mega') {
        if (matchCount === 6) return { name: "JACKPOT", color: "text-amber-400 font-black animate-pulse" };
        if (matchCount === 5) return { name: "Giải Nhất (10tr)", color: "text-emerald-400 font-bold" };
        if (matchCount === 4) return { name: "Giải Nhì (300k)", color: "text-emerald-400 font-bold" };
        if (matchCount === 3) return { name: "Giải Ba (30k)", color: "text-blue-400 font-medium" };
      } else if (game === 'power') {
        if (matchCount === 6) return { name: "JACKPOT 1", color: "text-amber-400 font-black animate-pulse" };
        if (matchCount === 5) return { name: "Giải Nhất (40tr)", color: "text-emerald-400 font-bold" };
        if (matchCount === 4) return { name: "Giải Nhì (500k)", color: "text-emerald-400 font-bold" };
        if (matchCount === 3) return { name: "Giải Ba (50k)", color: "text-blue-400 font-medium" };
      }
      return matchCount > 0 ? { name: `Trúng ${matchCount} số`, color: "text-slate-400" } : { name: "Chưa trúng", color: "text-slate-500" };
    }

    function renderHistoryList() {
      const tickets = getStoredTickets();
      const container = document.getElementById('history-list');

      if (!tickets.length) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-500">
            <p class="text-3xl mb-2">🎟️</p>
            <p class="text-xs">Chưa có vé nào được lưu.</p>
            <p class="text-[11px] mt-1 text-slate-600">Sau khi lọc số, bấm "Lưu vé đã mua" để theo dõi kết quả.</p>
          </div>
        `;
        return;
      }

      const latestDrawNumbers = currentData?.draws?.[0]?.numbers || [];
      const latestDrawDate = currentData?.draws?.[0]?.date || '';

      container.innerHTML = tickets.map(ticket => {
        const matched = ticket.numbers.filter(n => latestDrawNumbers.includes(n));
        const prize = checkPrize(ticket.game, matched.length);

        return `
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 shadow">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-amber-400">${ticket.gameName}</span>
                <span class="text-[10px] text-slate-500">${ticket.savedAt}</span>
              </div>
              <button onclick="deleteTicket('${ticket.id}')" class="text-slate-500 hover:text-red-400 text-xs px-1">✕</button>
            </div>

            <div class="flex flex-wrap gap-1.5 mb-2">
              ${ticket.numbers.map(n => {
                const isMatch = latestDrawNumbers.includes(n);
                return `
                  <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                    isMatch 
                      ? 'bg-emerald-500 text-slate-950 ring-2 ring-emerald-300 font-extrabold shadow-md shadow-emerald-500/40' 
                      : 'bg-slate-800 text-slate-300 border border-slate-700'
                  }">
                    ${n < 10 ? '0' + n : n}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="flex items-center justify-between text-[11px] pt-1.5 border-t border-slate-800/80">
              <span class="text-slate-400">Kỳ mở thưởng: <span class="text-slate-300 font-mono">${latestDrawDate || 'Đang cập nhật'}</span></span>
              <span class="${prize.color}">${matched.length > 0 ? `✨ ${prize.name}` : prize.name}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Đăng ký Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker ready:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // Khởi chạy khi mở web & cập nhật đếm ngược mỗi giây
    loadData();
    setInterval(updateCountdownDisplay, 1000);
  </script>
</body>
</html>
